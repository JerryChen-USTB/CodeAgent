schema_version: 1
name: codeagent_course_benchmark
description: Lightweight benchmark inputs for the course software-engineering agent
default_output_dir: codeagent_runs/benchmark
cases:
  - case_id: humaneval_000_has_close_elements
    config: cases/humaneval_000_has_close_elements/task_config.yaml
    enabled: true
  - case_id: humaneval_001_separate_paren_groups
    config: cases/humaneval_001_separate_paren_groups/task_config.yaml
    enabled: true
  - case_id: mbpp_002_similar_elements
    config: cases/mbpp_002_similar_elements/task_config.yaml
    enabled: true
  - case_id: mbpp_003_is_not_prime
    config: cases/mbpp_003_is_not_prime/task_config.yaml
    enabled: true
  - case_id: quixbugs_gcd
    config: cases/quixbugs_gcd/task_config.yaml
    enabled: true
  - case_id: quixbugs_find_in_sorted
    config: cases/quixbugs_find_in_sorted/task_config.yaml
    enabled: true
  - case_id: bugsinpy_black_001
    config: cases/bugsinpy_black_001/task_config.yaml
    enabled: false
    note: "BugsInPy requires official checkout plus a WSL conda Python 3.8.3 environment"
