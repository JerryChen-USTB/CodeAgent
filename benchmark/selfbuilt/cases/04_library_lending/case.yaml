schema_version: 1
case_id: 04_library_lending
title: Library Lending Manager
difficulty: medium_high
task_type: project_implementation_testing_debug_repair
language: python
project_type: web_ui
stages:
  - implementation
  - testing
  - debugging
  - repair
entrypoint:
  command: "python -m library_lending --db library.db --host 127.0.0.1 --port 8000"
workspace:
  path: workspace
  initial_state: empty
input_materials:
  - path: input/PRD.md
    type: prd
    required: true
  - path: input/user_stories.md
    type: user_stories
    required: true
  - path: input/design_model.md
    type: design_model
    required: true
  - path: input/acceptance_criteria.md
    type: acceptance_criteria
    required: true
agent_visibility:
  visible_paths:
    - input
    - workspace
  hidden_paths:
    - oracle_tests
test_command:
  command: "python -m unittest discover -s oracle_tests"
  timeout_seconds: 20
success_criteria:
  - The agent creates a runnable standard-library web UI package library_lending in the empty workspace.
  - The default entrypoint starts a local browser-accessible HTTP service backed by SQLite.
  - HTML forms, SQLite persistence, lending workflow, stock checks, due dates, overdue reports, and error handling match the input materials.
  - All hidden oracle tests pass.
