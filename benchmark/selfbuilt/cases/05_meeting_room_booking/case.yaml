schema_version: 1
case_id: 05_meeting_room_booking
title: Meeting Room Booking Web UI
difficulty: high
task_type: project_implementation_testing_debug_repair
language: python
project_type: flask_web_ui
stages:
  - implementation
  - testing
  - debugging
  - repair
entrypoint:
  command: "python -m meeting_room_booking --db meeting_rooms.db --host 127.0.0.1 --port 8000"
  package: meeting_room_booking
  app_factory: "meeting_room_booking:create_app"
workspace:
  path: workspace
  initial_state: empty
input_materials:
  - path: input/PRD.md
    type: prd
    required: true
  - path: input/user_stories.md
    type: user_stories
    required: true
  - path: input/design_model.md
    type: design_model
    required: true
  - path: input/acceptance_criteria.md
    type: acceptance_criteria
    required: true
agent_visibility:
  visible_paths:
    - input
    - workspace
  hidden_paths:
    - oracle_tests
dependency_expectation:
  - "Create workspace/requirements.txt containing Flask>=3.0,<4.0 or another compatible Flask 3 dependency spec."
test_command:
  command: "python -m unittest discover -s oracle_tests"
  timeout_seconds: 25
success_criteria:
  - The agent creates a Flask Web UI and JSON API package meeting_room_booking in the empty workspace.
  - The app exposes create_app(db_path=None), uses SQLite persistence, and follows the Web UI and API contracts in input materials.
  - The default entrypoint starts a browser-accessible Flask app backed by SQLite.
  - All hidden oracle tests pass.
