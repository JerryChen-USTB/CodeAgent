epic: personal_todo_management
stories:
  - id: US-01
    role: 个人用户
    goal: 添加一个带截止日期和优先级的待办任务
    benefit: 我可以记录需要完成的事情并区分紧急程度
    acceptance:
      - add 命令创建新任务
      - 新任务状态为 open
      - 命令输出 created task 和任务 ID
  - id: US-02
    role: 个人用户
    goal: 查看当前所有任务
    benefit: 我可以知道自己有哪些事情未完成或已完成
    acceptance:
      - list 命令按 ID 升序输出
      - 没有任务时输出 no tasks
      - 可以用 --status open 或 done 过滤
  - id: US-03
    role: 个人用户
    goal: 将任务标记为已完成
    benefit: 我可以维护任务进度
    acceptance:
      - done 命令把状态改为 done
      - 再次 list --status done 可以看到该任务
  - id: US-04
    role: 个人用户
    goal: 删除不再需要的任务
    benefit: 我可以保持任务列表简洁
    acceptance:
      - delete 命令删除指定任务
      - 删除后 list 不再显示该任务
  - id: US-05
    role: 个人用户
    goal: 在输入错误时得到清晰提示
    benefit: 我可以知道如何修正命令
    acceptance:
      - 空标题返回非 0
      - 不存在的任务 ID 返回非 0
      - 错误日期返回非 0
