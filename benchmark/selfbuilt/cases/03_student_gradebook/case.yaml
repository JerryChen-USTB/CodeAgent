schema_version: 1
case_id: 03_student_gradebook
title: Student Gradebook
difficulty: medium
task_type: project_implementation_testing_debug_repair
language: python
project_type: tui
stages:
  - implementation
  - testing
  - debugging
  - repair
entrypoint:
  command: "python -m student_gradebook"
workspace:
  path: workspace
  initial_state: empty
input_materials:
  - path: input/PRD.md
    type: prd
    required: true
  - path: input/user_stories.md
    type: user_stories
    required: true
  - path: input/design_model.md
    type: design_model
    required: true
  - path: input/acceptance_criteria.md
    type: acceptance_criteria
    required: true
agent_visibility:
  visible_paths:
    - input
    - workspace
  hidden_paths:
    - oracle_tests
test_command:
  command: "python -m unittest discover -s oracle_tests"
  timeout_seconds: 15
success_criteria:
  - The agent creates a runnable student_gradebook package in the empty workspace.
  - The default entrypoint starts a simple interactive TUI that can be driven through stdin.
  - Student, course, grade, query, statistics, ranking, JSON persistence, and validation behavior match the input materials.
  - All hidden oracle tests pass.
