epic: personal_finance_tracking
stories:
  - id: US-01
    role: 个人用户
    goal: 添加一笔支出
    benefit: 我可以记录自己的消费明细
    acceptance:
      - add 命令保存记录
      - 金额保存为两位小数
      - 输出 added record 和记录 ID
  - id: US-02
    role: 个人用户
    goal: 查看某个月的全部记录
    benefit: 我可以回顾当月消费
    acceptance:
      - list --month 只显示指定月份
      - 记录按日期和 ID 排序
  - id: US-03
    role: 个人用户
    goal: 查看月度收支汇总
    benefit: 我可以了解本月结余和主要支出类别
    acceptance:
      - summary 输出 income、expense、balance
      - 支出分类按分类名升序输出
  - id: US-04
    role: 个人用户
    goal: 导出 CSV
    benefit: 我可以用表格软件继续分析
    acceptance:
      - export 创建 CSV 文件
      - 表头为 id,date,type,category,amount,note
  - id: US-05
    role: 个人用户
    goal: 避免错误数据进入账本
    benefit: 我的统计结果不会被脏数据污染
    acceptance:
      - 非法日期失败
      - 非法金额失败
      - 空分类失败
